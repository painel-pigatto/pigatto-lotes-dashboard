name: Atualizar Dashboard de Lotes a Vencer

on:
  schedule:
    # Agendado para 07:15 de Brasília (10:15 UTC): o GitHub costuma iniciar
    # agendamentos com 15–25 min de atraso, então os dados ficam prontos antes das 8h.
    - cron: '15 10 * * *'
  workflow_dispatch: {}   # permite rodar manualmente em Actions > Run workflow

permissions:
  contents: write   # necessário para o passo de commit automático gravar docs/data.json

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Buscar dados no Omie e gerar docs/data.enc.json (criptografado)
        env:
          OMIE_APP_KEY: ${{ secrets.OMIE_APP_KEY }}
          OMIE_APP_SECRET: ${{ secrets.OMIE_APP_SECRET }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
        run: python scripts/fetch_omie_data.py

      - name: Publicar dados atualizados (commit automático)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza dados do dashboard (automático)"
          file_pattern: docs/data.enc.json
